<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교육연구부 업무 절차(부서용)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 배치: 위 메뉴 6개. 본문은 줄 목록(날짜 · 단계 · 완료)과 큰 단계 묶음, 단계를 누르면 오른쪽에서 상세가 열림 */
:root{
  --bg:#F3F5F8; --panel:#FFFFFF; --ink:#172033; --sub:#515C70; --line:#D6DCE6; --seg:#E4E8EF;
  --accent:#1F3F7A; --accent-tint:#E3EAF6; --hot:#A8480A; --hot-tint:#FCEBDB;
  --display:"IBM Plex Sans KR","Noto Sans KR","Malgun Gothic",sans-serif;
  --body:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#12161F; --panel:#1A2030; --ink:#E3E8F2; --sub:#9AA6BC; --line:#2C3549; --seg:#232A3B;
    --accent:#9DB9F0; --accent-tint:#222E48; --hot:#F0A868; --hot-tint:#3A2A1C; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#12161F; --panel:#1A2030; --ink:#E3E8F2; --sub:#9AA6BC; --line:#2C3549; --seg:#232A3B;
  --accent:#9DB9F0; --accent-tint:#222E48; --hot:#F0A868; --hot-tint:#3A2A1C; color-scheme:dark; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .fbar{background:color-mix(in srgb,var(--c,var(--accent)) 34%,transparent);color:color-mix(in srgb,var(--c,var(--accent)) 30%,#fff)} }
:root[data-theme="dark"] .fbar{background:color-mix(in srgb,var(--c,var(--accent)) 34%,transparent);color:color-mix(in srgb,var(--c,var(--accent)) 30%,#fff)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
header.top{background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;z-index:6}
.top-in{max-width:1360px;margin:0 auto;padding:0 28px;display:flex;align-items:center;gap:8px 30px;flex-wrap:wrap}
.top-in strong{font-family:var(--display);font-size:17px;padding:14px 0}
nav.tabs{display:flex;flex-wrap:wrap}
nav.tabs a{padding:15px 2px;margin-right:22px;text-decoration:none;color:var(--sub);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.top-r{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--sub);font-size:13.5px}
.top-r select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 8px}
.banner{background:var(--hot-tint);color:var(--hot);padding:7px 20px;font-size:13.5px;text-align:center}
.editbar{flex:0 0 auto;background:var(--accent);color:var(--panel);padding:6px 20px;font-size:13.5px;display:flex;gap:14px;align-items:center;justify-content:center}.editbar[hidden]{display:none}
#edit-btn{display:none}
body.open .editbar{padding-right:548px}
.editbar .btn{background:var(--panel);color:var(--accent);border-color:var(--panel);font-weight:700}
main{max-width:1360px;width:100%;margin:0 auto;padding:28px 28px 70px;transition:padding .15s;flex:1 1 auto;min-height:0;overflow:auto}
main.fit{overflow:hidden;padding-bottom:0}main.fit #v-areas{height:100%}main.fit #v-areas .area-wrap{height:100%;flex-wrap:nowrap;align-items:stretch}main.fit #v-areas .side{overflow:auto;padding-bottom:30px}main.fit #v-areas .area-main{overflow:auto;padding:0 6px 70px 0}main.fit #v-areas .area-main>*{flex:0 0 auto}
@media (max-width:900px){main.fit{overflow:auto;padding-bottom:70px}main.fit #v-areas,main.fit #v-areas .area-wrap{height:auto}main.fit #v-areas .area-wrap{flex-wrap:wrap}main.fit #v-areas .side,main.fit #v-areas .area-main{overflow:visible}}
.tg{display:inline-block;font-size:11.5px;font-weight:700;padding:0 7px;border-radius:5px;margin-left:8px;vertical-align:2px;line-height:1.6}.tg.tgs{color:var(--accent);border:1px solid var(--accent)}.tg.tge{background:var(--hot);color:var(--panel);border:1px solid var(--hot)}.tg.tgp{color:var(--sub);border:1px solid var(--sub)}
.adot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.btn.sm{min-height:34px;padding:0 11px;font-size:13px}.wknav{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
body.open main{padding-right:548px;max-width:none}
.view{display:none;flex-direction:column;gap:26px}.view.on{display:flex}
h2{font-family:var(--display);font-size:27px;margin:0;text-wrap:balance}
h3{font-family:var(--display);margin:0}
.sub{color:var(--sub)}.hot{color:var(--hot);font-weight:700}
.hl{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.two{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}.two>*{flex:1 1 400px;min-width:0}
.sec-h{display:flex;align-items:baseline;gap:10px;padding:0 2px 8px}.sec-h h3{font-size:19px}.sec-h .n{margin-left:auto}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);border-left:4px solid transparent;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--accent-tint)}
.row.sel{background:var(--hot-tint);border-left-color:var(--hot)}
.row .d{text-align:center;line-height:1.15}.row .d b{display:block;font-family:var(--display);font-size:20px}.row .d span{font-size:12px;color:var(--sub)}
.row .t{font-size:16px;font-weight:700}.row .s{font-size:13px;color:var(--sub)}
.row.done .d,.row.done .m,.row.dim .d,.row.dim .m{opacity:.5}.row.done .t{text-decoration:line-through}
.row.est .d b{font-weight:400;color:color-mix(in srgb,var(--sub) 62%,var(--panel))}.row.est .d span{color:color-mix(in srgb,var(--sub) 62%,var(--panel))}
.row.fx .d b{color:var(--accent)}.row.fx .d span{color:var(--accent);font-weight:700}
.tg.tgq{color:var(--sub);border:1px dashed color-mix(in srgb,var(--sub) 60%,var(--panel));font-weight:400}
.row .d .wkl{display:block;font-size:12.5px;line-height:1.35;color:var(--sub)}.row .d .wkl b{display:inline;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--ink)}
.list .lsep.ar{display:flex;align-items:center;gap:2px;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer}.list .lsep.ar small{font-weight:400;color:var(--sub);margin-left:6px}
.wknav .seg{margin-left:auto}.wknav .seg button{min-height:30px;padding:0 13px;font-size:13px}
.list .lsep{padding:6px 14px;font-size:12.5px;color:var(--sub);background:color-mix(in srgb,var(--line) 35%,transparent);border-bottom:1px solid var(--line)}
.done-btn{min-height:40px;min-width:78px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--sub);font-size:13.5px;cursor:pointer}
.done-btn[aria-pressed="true"]{background:var(--accent-tint);border-color:var(--accent-tint);color:var(--accent);font-weight:700}
.done-btn.stb{border-style:dashed}.done-btn.stb[aria-pressed="true"]{background:transparent;border:1px solid var(--accent);color:var(--accent)}
table.t td .in1{min-width:110px}table.t td textarea.in1{min-height:40px;min-width:220px}
.none{color:var(--sub);padding:14px 16px;font-size:14px}
details.more>summary{cursor:pointer;color:var(--sub);padding:4px 2px}
#week-past{margin:0 0 18px}#week-past>summary{color:var(--hot);font-weight:700;font-size:15px}#week-past>summary small{font-weight:400;color:var(--sub);font-size:13px;margin-left:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.flow-head,.flow-lane{display:flex}.flow-name{flex:0 0 96px;font-weight:700;font-size:14px;padding:9px 0}
.flow-months{flex:1;display:flex}.flow-months div{flex:1;text-align:center;font-size:12.5px;color:var(--sub);border-left:1px solid var(--line);padding:3px 0}
.flow-lane{border-top:1px solid var(--line)}.flow-track{flex:1;position:relative}
.fbar{position:absolute;height:24px;border-radius:6px;background:color-mix(in srgb,var(--c,var(--accent)) 17%,transparent);color:var(--c,var(--accent));font-size:12px;font-weight:500;line-height:24px;padding:0 6px;overflow:hidden;white-space:nowrap;border:0;cursor:pointer;text-align:left}
.fbar.now{box-shadow:inset 0 0 0 1.5px var(--c,var(--accent));font-weight:700}
.fcore{position:absolute;height:5px;border-radius:3px;background:var(--c,var(--accent));pointer-events:none}
.fdot{position:absolute;border:0;background:none;padding:0 0 0 13px;margin-left:-5px;cursor:pointer;text-align:left;line-height:1.25;color:var(--ink);white-space:nowrap}
.fdot::before{content:"";position:absolute;left:0;top:3px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent))}
.fdot b{display:block;font-size:12.5px}.fdot span{display:block;font-size:11.5px;color:var(--sub)}
.fdot.past{opacity:.55}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--hot)}
.area-wrap{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.side{flex:0 0 190px;display:flex;flex-direction:column}
.side .gr{border-top:2px solid var(--line);padding:9px 0 8px;display:flex;flex-direction:column}.side .gr:first-child{border-top:0;padding-top:0}
.side .g{font-size:13px;color:var(--ink);font-weight:700;padding:2px 12px 5px}
.side button{border:0;background:none;text-align:left;padding:8px 12px;border-radius:8px;cursor:pointer}
.side button[aria-pressed="true"]{background:var(--accent);color:var(--panel);font-weight:700}
.area-main{flex:1 1 520px;min-width:0;display:flex;flex-direction:column;gap:18px}
.seg{display:inline-flex;gap:2px;background:var(--seg);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;min-height:40px;padding:0 16px;border-radius:8px;color:var(--sub);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:700}
.acc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.grp>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto auto auto;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary b{font-size:16.5px}.grp>summary small{color:var(--sub);font-size:13px;margin-left:6px}
.grp.fin>summary{opacity:.6}
.grp.nowg>summary{box-shadow:inset 4px 0 0 var(--hot)}
@keyframes nowglow{0%{background-color:transparent}20%{background-color:var(--hot-tint)}60%{background-color:var(--hot-tint)}100%{background-color:transparent}}
@keyframes nowsweep{0%{background-position:-70% 0}100%{background-position:170% 0}}
.grp.flash>summary{background-image:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);background-size:55% 100%;background-repeat:no-repeat;background-position:-70% 0;animation:nowglow 1.6s ease-in-out 2,nowsweep 1.6s cubic-bezier(.4,0,.2,1) 2}
@media (prefers-reduced-motion:reduce){.grp.flash>summary{animation:none;background-image:none}}
.grp .in{background:var(--bg);padding:6px 0 6px 28px;border-bottom:1px solid var(--line)}.grp .in .row{background:var(--panel)}.grp .in .row.sel{background:var(--hot-tint)}.grp .in .row:hover{background:var(--accent-tint)}
.badge{font-size:12.5px;font-weight:700;color:var(--hot);background:var(--hot-tint);border-radius:4px;padding:1px 8px}
.rail{flex:0 0 160px;display:flex;flex-direction:column;gap:2px}
.rail button{border:0;background:none;text-align:left;padding:9px 14px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between}
.rail button[aria-pressed="true"]{background:var(--accent);color:var(--panel);font-weight:700}
.steps5{display:flex;gap:8px;flex-wrap:wrap}.steps5 div{flex:1 1 130px;text-align:center;padding:9px 6px;background:var(--accent-tint);color:var(--accent);border-radius:8px;font-weight:500;font-size:14px}
.bul{margin:0;padding-left:20px}.bul li{padding:2px 0}
.neis{background:var(--bg);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:8px 12px;font-size:13.5px}.neis div{padding:2px 0}
.lab{margin:14px 0 6px;font-size:13px;color:var(--sub);font-weight:500}
.chk{display:flex;gap:10px;padding:4px 0}.chk i{flex:0 0 17px;height:17px;border:1.5px solid var(--sub);border-radius:4px;margin-top:4px;position:relative}
.chk[data-chk]{cursor:pointer;border-radius:6px;margin:0 -6px;padding:4px 6px}.chk[data-chk]:hover{background:var(--accent-tint)}.chk[data-chk]:focus-visible{outline:2px solid var(--accent)}
.chk.on i{background:var(--accent);border-color:var(--accent)}.chk.on i:after{content:'';position:absolute;left:4.5px;top:1px;width:4px;height:9px;border:solid var(--panel);border-width:0 2px 2px 0;transform:rotate(45deg)}.chk.on span{color:var(--sub)}
.done-btn.cnt{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.5px}.done-btn.cnt.on{border-color:var(--accent);color:var(--accent)}
.in1:disabled{opacity:.45}
.mvrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}.btn:disabled{opacity:.4;cursor:default}
.edbox .now{font-size:13.5px;line-height:1.55;color:var(--ink);background:var(--accent-tint);border-radius:8px;padding:9px 12px}
.btn{display:inline-flex;align-items:center;min-height:40px;padding:0 15px;border-radius:8px;border:1px solid var(--accent);background:var(--panel);color:var(--accent);font-size:13.5px;font-weight:500;cursor:pointer;text-decoration:none}
.btn.solid{background:var(--accent);color:var(--panel)}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.mrow span.g{flex:1;min-width:0}.mrow small{display:block;color:var(--sub);font-size:12.5px}
details.mb>summary{cursor:pointer;list-style:none}details.mb>summary::-webkit-details-marker{display:none}
details.mb pre,.pre{white-space:pre-wrap;word-break:break-word;font-family:var(--body);font-size:14px;background:var(--bg);border-radius:8px;padding:12px 14px;margin:6px 0 10px}
.warnbox{background:var(--hot-tint);color:var(--hot);border-radius:8px;padding:11px 14px}.warnbox ul{margin:0;padding-left:18px}
aside.drawer{position:fixed;top:var(--hh,57px);right:0;bottom:0;width:520px;max-width:100vw;background:var(--panel);border-left:1px solid var(--line);z-index:8;padding:22px 24px 0;overflow:auto;display:none;box-shadow:-8px 0 24px rgba(0,0,0,.08)}
body.open aside.drawer{display:flex;flex-direction:column}
.dbody{flex:1 0 auto;padding-bottom:28px}
.dfoot{position:sticky;bottom:0;margin:0 -24px;padding:12px 24px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dfoot .done-btn{min-height:42px;padding:0 20px;font-size:14.5px}.dfoot .done-btn[aria-pressed="false"]:not(.stb){background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:700}
.stp{position:relative;display:flex;gap:12px;margin-top:18px}.stp>.no{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent);color:var(--panel);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.stp:not(.last):before{content:"";position:absolute;left:12px;top:31px;bottom:-15px;width:2px;background:var(--line)}
.stp>.sb{flex:1;min-width:0}.stp .stt{font-weight:700;font-size:15.5px;line-height:26px}.stp .sb>.lab{margin-top:10px}.stp .sb>.lab.q{margin:4px 0}.stp .sb>.lab.q .mini{margin-left:0}
.drawer .x{float:right}
.drawer h3{font-size:23px;margin:4px 0 6px}
.search{font-size:18px;min-height:52px;padding:0 18px;border:2px solid var(--accent);border-radius:10px;background:var(--panel);width:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.res{display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);border-left:4px solid transparent;cursor:pointer}
.res.sel{background:var(--hot-tint);border-left-color:var(--hot)}.res .k{font-size:12.5px;color:var(--accent);font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.pc strong{font-size:16px;min-width:0}.pc .tag{flex:0 0 auto;white-space:nowrap;align-self:flex-start}.pc p{margin:0;color:var(--sub);font-size:14px;flex:1}.pc .path{font-size:12px;color:var(--sub);word-break:break-all}
.tag{font-size:12px;color:var(--hot);background:var(--hot-tint);border-radius:4px;padding:1px 7px;white-space:nowrap}
table.t{width:100%;border-collapse:collapse}table.t th,table.t td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:middle}
table.t th{background:var(--accent-tint);color:var(--sub);font-size:13px;font-weight:500}
.in1{min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);width:100%}
textarea.in1{padding:8px 10px;min-height:96px;resize:vertical}
.mini{display:inline-flex;align-items:center;white-space:nowrap;min-height:26px;padding:0 9px;margin-left:8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--accent);font-size:12.5px;font-weight:500;cursor:pointer}
.le{display:flex;gap:6px;align-items:flex-start;margin:5px 0}.le textarea{flex:1;min-width:0;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);resize:none;overflow:hidden;line-height:1.5}
.le .mini{margin-left:0;min-height:40px;min-width:36px;justify-content:center;padding:0 8px}
.edbox{border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin:6px 0 4px}.edbox .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.opt{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14px;color:var(--ink);line-height:1.5}.opt input{margin-top:5px}.form label.opt{flex-direction:row;font-size:14px;color:var(--ink)}.opt small{display:block;color:var(--sub);font-size:12.5px}
.form{display:flex;flex-direction:column;gap:12px}.form label{font-size:13px;color:var(--sub);display:flex;flex-direction:column;gap:4px}
.pwbox{position:fixed;inset:0;background:rgba(15,20,35,.45);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}.pwbox .card{width:360px;max-width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.gd.est{color:color-mix(in srgb,var(--sub) 62%,var(--panel))}.gd.fx{color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}

@media (max-width:1100px){body.open main{padding-right:28px}body.open .editbar{padding-right:20px}}

/* 날짜를 정하지 않은 단계는 '예상'이라 주 단위로만 보임: 그 주 월요일이 든 달의 몇째 주 */
function monOf(d){ return new Date(+d - ((d.getUTCDay() + 6) % 7) * DAY); }

function wdays(o){ var a = monOf(o.start), b = new Date(+monOf(o.end || o.start) + 4 * DAY); return md(a) + ' ~ ' + md(b); }

function kindOk(k, name){ return k === '1차만' ? /1차/.test(name) : k === '2차만' ? /2차/.test(name) : k === '1학기만' ? /^1학기/.test(name) : k === '2학기만' ? /^2학기/.test(name) : true; }

function prepare(){
  steps = table('업무 단계'); msgs = table('메시지'); progs = table('프로그램·링크'); meet = table('협의록·학관위'); duty = table('담당'); etc = table('기타'); adjs = table('날짜 조정'); accounts = table('계정');

  bases = plans.filter(function(p){ return p.base; });

  $('quick').innerHTML = progs.filter(function(p){ return p['종류'] === '바로가기' && p['주소']; }).map(function(p){ return '<a class="btn sm" target="_blank" rel="noopener" href="' + esc(p['주소']) + '">' + esc(p['이름']) + '</a>'; }).join('');
  doneSet = {}; doneDay = {}; startSet = {}; chkSet = {}; table('완료 기록').forEach(function(r){ var dk = r['학년도'] + '|' + r['회차'] + '|' + r['단계 이름']; if (r['체크']) chkSet[dk] = String(r['체크']);
    if (r['완료'] === '완료'){ doneSet[dk] = true; doneDay[dk] = r['완료한 날']; } else if (r['완료'] === '진행 중') startSet[dk] = r['완료한 날'] || '-'; });
  var years = []; bases.forEach(function(b){ if (years.indexOf(b.year) < 0) years.push(b.year); }); years.sort();
  var now = new Date(), pick = years[years.length - 1]; years.forEach(function(y){ if (now >= new Date(+y, 1, 1)) pick = y; });
  if (years.indexOf(S.year) < 0) S.year = pick;
  $('year').innerHTML = years.map(function(y){ return '<option' + (y === S.year ? ' selected' : '') + '>' + esc(y) + '</option>'; }).join('');

}
function roundsFor(st){
  var b = st['기준일 이름'], rs;
  if (b === '개학일' || b === '방학식') rs = bases.filter(function(x){ return x.year === S.year && x.base === '개학일'; });
  else rs = bases.filter(function(x){ return x.year === S.year && x.area === st['영역'] && (x.base === b || (b === '종강일' && x.base === '개강일')); });
  return rs.filter(function(r){ return kindOk(st['회차 구분'], r.round); });
}
function calc(st, r){
  var a = num(st['시작(일)']), b = num(st['끝(일)']);
  if ((st['기준일 이름'] === '개학일' || st['기준일 이름'] === '방학식') && /^2학기/.test(r.round) && num(st['2학기 시작(일)']) !== null){ a = num(st['2학기 시작(일)']); b = num(st['2학기 끝(일)']); }
  var base = (st['기준일 이름'] === '종강일' || st['기준일 이름'] === '방학식') ? r.end : r.start, o = { step: st, round: r, start: null, end: null, adj: false, fix: false };
  if (base && a !== null){ o.start = shift(new Date(+base + a * DAY)); o.end = b !== null ? shift(new Date(+base + b * DAY)) : o.start; }
  var ad = adjs.filter(function(x){ return x['학년도'] === S.year && x['단계 이름'] === st['단계 이름'] && x['회차'] === r.round; })[0];
  if (ad && String(ad['확정 날짜(시작)']).trim() === '없음'){ o.start = null; o.end = null; o.adj = true; o.none = true; }   // 이 회차만 날짜 없이(상시)
  else if (ad && pDate(ad['확정 날짜(시작)'])){ o.start = pDate(ad['확정 날짜(시작)']); o.end = pDate(ad['확정 날짜(끝)']) || o.start; o.adj = true; }
  o.fix = !o.none && (o.adj || (!!o.start && a === 0 && b === null));   // 날짜를 정했거나, 기준일 당일에 하는 일
  return o;
}
function build(){
  occ = [];
  steps.forEach(function(st){
    if (st['기준일 이름'] === '없음' || !st['기준일 이름']){ occ.push({ step: st, round: null, start: null, end: null }); return; }
    roundsFor(st).forEach(function(r){ occ.push(calc(st, r)); });
  });
  renderAll();
}
var rname = function(o){ return o.round ? o.round.round : ''; };
var key = function(o){ return o.step['단계 이름'] + '|' + rname(o); };
var dkey = function(o){ return S.year + '|' + rname(o) + '|' + o.step['단계 이름']; };
var isDone = function(o){ return !!doneSet[dkey(o)]; };
var isStart = function(o){ return !doneSet[dkey(o)] && !!startSet[dkey(o)]; };   // 시작만 표시한 것(완료 기록 탭의 '진행 중')
/* 완료·시작 표시를 받아 둔 자료에도 적어 둠(다른 것을 고친 뒤 화면을 다시 그려도 표시가 남도록) */
function markLocal(o, state, checks){ var v = D['완료 기록']; if (!v || !v.length) return; var hd = v[0], cy = hd.indexOf('학년도'), cr = hd.indexOf('회차'), cs = hd.indexOf('단계 이름'), cd = hd.indexOf('완료'), cw = hd.indexOf('완료한 날'), hit = null, cc = hd.indexOf('체크');
  if (cc < 0){ hd.push('체크'); cc = hd.length - 1; }
  v.slice(1).forEach(function(r){ if (String(r[cy]) === S.year && String(r[cr] == null ? '' : r[cr]) === rname(o) && r[cs] === o.step['단계 이름']) hit = r; });
  if (!hit){ if (!state && !checks) return; hit = hd.map(function(){ return ''; }); hit[cy] = S.year; hit[cr] = rname(o); hit[cs] = o.step['단계 이름']; v.push(hit); }
  hit[cd] = state; hit[cw] = state ? iso(today()) : ''; if (checks !== undefined) hit[cc] = checks; }
function edTog(st){ return S.edit ? '<button type="button" class="btn sm solid" data-editoff="1"' + (st ? ' style="' + st + '"' : '') + '>수정 완료</button>' : '<button type="button" class="btn sm" data-editon="1"' + (st ? ' style="' + st + '"' : '') + '>수정하기</button>'; }

/* 하는 일 체크: 완료 기록 탭 '체크' 칸에 줄마다 O/X로 적음(예 OXO). 하는 일의 줄 수가 달라지면 그 체크는 버림 */
var chkSet = {}, doneQ = Promise.resolve();

function chkStr(o){ var s = String(chkSet[dkey(o)] || ''); return s.length === chkN(o) && /^[OX]+$/.test(s) ? s : ''; }
function chkArr(o){ var n = chkN(o), s = chkStr(o), dn = isDone(o), a = []; for (var i = 0; i < n; i++) a.push(dn || s.charAt(i) === 'O'); return a; }

function doneWrite(o, body, msg){ var b = { action: 'done', year: S.year, round: rname(o), step: o.step['단계 이름'] }; Object.keys(body).forEach(function(k){ b[k] = body[k]; });
  doneQ = doneQ.then(function(){ return write(b, msg); }).then(function(ok){ if (ok) markLocal(o, b.state, b.checks); else prepare(); }); return doneQ; }
function rowHtml(o, opt){
  opt = opt || {}; var dn = isDone(o), sg = isStart(o), sb = opt.mark === 's' && !dn, fx = !!o.fix, multi = isMulti(o), wk = opt.mark !== undefined;
  var d = opt.mark === 's' ? o.start : (o.end || o.start), rng = multi ? (opt.mark === 's' ? md(o.end) + '까지' : md(o.start) + '부터') : '';
  var sub = [opt.area ? o.step['영역'] : '', wk ? o.step['시점'] : '', o.step['담당 역할'], rng, o.adj && !o.none ? '날짜 확정' : ''].filter(Boolean).join(' · '), cn = chkN(o), ck = cn >= 2 ? chkCnt(o) : 0;
  var tag = opt.mark === 's' ? '<span class="tg ' + (fx ? 'tgs' : 'tgq') + '">시작</span>' : opt.mark === 'e' ? '<span class="tg ' + (fx ? 'tge' : 'tgq') + '">마감</span>' : '';
  // 날짜를 정한 단계(fx)는 남색 굵은 날짜, 정하지 않은 단계(est)는 옅은 예상 날짜
  return '<div class="row' + (S.sel === key(o) ? ' sel' : '') + (dn ? ' done' : sb && sg ? ' dim' : '') + (o.start ? (fx ? ' fx' : ' est') : '') + '" data-key="' + esc(key(o)) + '" tabindex="0" role="button">' +
    '<div class="d"' + (o.start && !fx ? ' title="예상 날짜"' : '') + '>' + (d ? '<b>' + d.getUTCDate() + '</b><span>' + (opt.month ? (d.getUTCMonth()+1) + '월 ' : '') + DAYS[d.getUTCDay()] + '</span>' : '<span>상시</span>') + '</div>' +
    '<div class="m"><div class="t">' + esc(o.step['단계 이름']) + tag + (sg && !sb ? '<span class="tg tgp">진행 중</span>' : '') + '</div><div class="s">' + (opt.area ? adot(o.step['영역']) : '') + esc(sub) + '</div></div>' +
    (cn >= 2 ? '<button type="button" class="done-btn cnt' + (dn || ck ? ' on' : '') + '" aria-pressed="' + dn + '" title="하는 일 ' + cn + '개 가운데 ' + ck + '개를 체크했습니다. 누르면 상세가 열립니다">' + (dn ? '✓ 완료' : ck + '/' + cn) + '</button>'
        : '<button type="button" class="done-btn" data-done="' + esc(key(o)) + '" aria-pressed="' + dn + '">' + (dn ? '✓ 완료' : '완료') + '</button>') + '</div>';
}
function listHtml(arr, opt){ return '<div class="list">' + (arr.length ? arr.map(function(o){ return rowHtml(o, opt); }).join('') : '<div class="none">일정이 없습니다.</div>') + '</div>'; }

/* ---------- 1. 이번 주 ---------- */
function renderWeek(){
  var t = today(), mon0 = new Date(+t - ((t.getUTCDay() + 6) % 7) * DAY), mon = new Date(+mon0 + S.wk * 7 * DAY);
  var wk = function(i){ var a = new Date(+mon + i * 7 * DAY), b = new Date(+a + 6 * DAY);
    var list = []; occ.forEach(function(o){ if (!o.start) return; var e = o.end || o.start, multi = +e !== +o.start;
      if (e >= a && e <= b) list.push({ o: o, mark: multi && o.start < a ? 'e' : '', d: e }); else if (multi && o.start >= a && o.start <= b) list.push({ o: o, mark: 's', d: o.start }); });
    list.sort(function(x, y){ return x.d - y.d; }); return { a: a, b: b, n: S.wk + i, list: list }; };
  var wlist = function(w){ var nf = w.list.filter(function(v){ return v.o.fix; }).length, rw = function(v){ return rowHtml(v.o, { area: true, mark: v.mark }); };

      var gs = {}, names = []; w.list.forEach(function(v){ var a = v.o.step['영역']; if (!gs[a]){ gs[a] = []; names.push(a); } gs[a].push(v); });
      names.sort(function(a, b){ var i = AORDER.indexOf(a), j = AORDER.indexOf(b); return (i < 0 ? 99 : i) - (j < 0 ? 99 : j); });
      return '<div class="list">' + (names.map(function(a){ gs[a].sort(function(x, y){ return x.d - y.d; });
        return '<div class="lsep ar" data-area="' + esc(a) + '" role="button" tabindex="0" title="' + esc(a) + ' 절차로 가기">' + adot(a) + esc(a) + '<small>' + gs[a].length + '건</small></div>' + gs[a].map(function(v){ return rowHtml(v.o, { mark: v.mark }); }).join(''); }).join('') || '<div class="none">이 주에 뜨는 일이 없습니다.</div>') + '</div>'; }
    return '<div class="list">' + (w.list.length ? w.list.map(rw).join('') : '<div class="none">이 주에 뜨는 일이 없습니다.</div>') + '</div>'; };
  var w0 = wk(0), w1 = wk(1), w2 = wk(2);
  var next = bases.filter(function(b){ return b.year === S.year && b.base === '시험 시작일' && b.start && b.start >= t; }).sort(function(a, b){ return a.start - b.start; })[0];
  var left = occ.filter(function(o){ var e = o.end || o.start; return e && e >= mon0 && e <= new Date(+mon0 + 6 * DAY) && !isDone(o); }).length;
